[package]
name = "mwf_convert"
version = "0.1.0"
description = "Host-side converter: reads the user's own MW2/IW4x install and produces Wii data. Never commits game data."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mwf-convert"
path = "src/main.rs"

[dependencies]
asset_transport = { git = "https://github.com/vladtrc/iw4L", rev = "acc57a5c9dd027db8eb5ef17c792fa69f059daa1" }
fastfile_iw4 = { git = "https://github.com/vladtrc/iw4L", rev = "acc57a5c9dd027db8eb5ef17c792fa69f059daa1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
