name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/check_no_assets.sh --all

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version, components and the powerpc target; rustup installs them.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Wii staticlib (big-endian PPC32) builds and lints
        run: |
          cargo clippy --release -p mwf_spikes -p iw4l_probe --target powerpc-unknown-linux-gnu -- -D warnings
          cargo build --release -p mwf_spikes --target powerpc-unknown-linux-gnu
      - name: IW4L movement determinism on PPC 750CL (qemu)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user gcc-powerpc-linux-gnu libc6-dev-powerpc-cross
          cargo test -p iw4l_probe --target powerpc-unknown-linux-gnu

  wii:
    runs-on: ubuntu-latest
    # devkitPro's official image: devkitPPC + libogc. Pin to a dated tag once the first build is green.
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          if ! command -v curl >/dev/null; then apt-get update && apt-get install -y --no-install-recommends curl ca-certificates; fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build .dol files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          make -C wii hbc BUILD_ID=$(echo "$GITHUB_SHA" | cut -c1-8)
      - uses: actions/upload-artifact@v4
        with:
          name: modernwiifare-spikes-${{ github.sha }}
          path: |
            wii/build/hbc/
            wii/build/*.elf.map
          if-no-files-found: error
