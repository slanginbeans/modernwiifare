name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/check_no_assets.sh --all

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version, components and the powerpc target; rustup installs them.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Wii staticlib (big-endian PPC32) builds and lints
        run: |
          cargo clippy --release -p mwf_spikes -p iw4l_probe -p gx_texture -p wpk --target powerpc-unknown-linux-gnu -- -D warnings
          cargo build --release -p mwf_spikes --target powerpc-unknown-linux-gnu
      - name: IW4L movement determinism on PPC 750CL (qemu)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user gcc-powerpc-linux-gnu libc6-dev-powerpc-cross
          cargo test -p iw4l_probe -p gx_texture --target powerpc-unknown-linux-gnu

  wii:
    runs-on: ubuntu-latest
    # devkitPro's official image: devkitPPC + libogc. Pin to a dated tag once the first build is green.
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      # The same script build.bat / build.sh run inside this image, so their Docker path is tested on every push.
      - name: Build .dol files (tools/docker-build.sh)
        run: |
          if ! command -v curl >/dev/null; then apt-get update && apt-get install -y --no-install-recommends curl ca-certificates; fi
          BUILD_ID=$(echo "$GITHUB_SHA" | cut -c1-8) sh tools/docker-build.sh package
      # Same dist/apps folder build.bat makes: copy "apps" to the SD card root.
      - uses: actions/upload-artifact@v4
        with:
          name: modernwiifare-sd-card
          path: dist/apps/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: modernwiifare-debug-${{ github.sha }}
          path: |
            dist/debug/
            wii/build/*.elf.map
          if-no-files-found: error

  windows:
    # The converter and the .bat files run on the user's Windows PC: build and exercise them there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test -p mwf_convert
      - name: inventory.bat end to end (dummy folder, no game data)
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\fakegame\zone\english"
          echo not a fastfile> "%RUNNER_TEMP%\fakegame\zone\english\mp_fake.ff"
          call inventory.bat "%RUNNER_TEMP%\fakegame" < NUL
          if errorlevel 1 exit /b 1
          findstr /c:"mp_fake" out\inventory.json || exit /b 1
