[package]
name = "mwf_game"
version = "0.1.0"
description = "The Modern Wiifare game: loads a map pack from SD and runs it (Wii-only staticlib, linked into mwf_game.dol)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[dependencies]
hud_iw4 = { git = "https://github.com/vladtrc/iw4L", rev = "acc57a5c9dd027db8eb5ef17c792fa69f059daa1" }
weapon_iw4 = { git = "https://github.com/vladtrc/iw4L", rev = "acc57a5c9dd027db8eb5ef17c792fa69f059daa1" }
playerstate_iw4 = { git = "https://github.com/vladtrc/iw4L", rev = "acc57a5c9dd027db8eb5ef17c792fa69f059daa1" }
game_core = { path = "../game_core" }
wpk = { path = "../../shared/wpk" }
libm = "0.2"
dpvs_iw4 = { git = "https://github.com/vladtrc/iw4L", rev = "acc57a5c9dd027db8eb5ef17c792fa69f059daa1" }
