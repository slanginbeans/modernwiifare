[workspace]
resolver = "3"
members = ["wii/syslink", "wii/spikes", "wii/iw4l_probe", "converter"]
# `mwf_spikes` is a Wii-only staticlib (no_std + panic handler); host builds/tests skip it.
default-members = ["wii/syslink", "wii/iw4l_probe", "converter"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
debug = 1
