[workspace]
resolver = "3"
members = ["wii/syslink", "wii/spikes", "wii/iw4l_probe", "wii/game_core", "wii/game", "converter", "shared/gx_texture", "shared/wpk"]
# `mwf_spikes` and `mwf_game` are Wii-only staticlibs (no_std + panic handler); host builds/tests skip them.
default-members = ["wii/syslink", "wii/iw4l_probe", "wii/game_core", "converter", "shared/gx_texture", "shared/wpk"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
debug = 1

# The converter (a PC tool) built quickly: optimised, but without the whole-program LTO, single codegen unit and
# debug info the Wii build wants (`tools/mwf-convert.ps1` uses it: rebuilding after an update takes about a minute
# instead of many).
[profile.converter]
inherits = "release"
panic = "unwind"
lto = false
codegen-units = 16
debug = 0
incremental = true
